openapi: 3.0.3
info:
  title: IQA Backend API
  version: 0.0.1
  description: 图像质量评估 API。
servers:
  - url: http://localhost:8080
paths:
  /auth/sign-up:
    post:
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAuthTokenResponse"
  /auth/login:
    post:
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAuthTokenResponse"
  /auth/refresh:
    post:
      summary: 刷新AccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAuthTokenResponse"
  /assess:
    post:
      summary: 单张图片评估
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePredictResult"
  /assess/batch:
    post:
      summary: 多张图片评估(SSE进度流)
      description: |
        返回text/event-stream流式事件.
        事件名称包括start, progress, result, completed, error.
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: 请求成功, 持续返回SSE事件直到任务结束
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AssessBatchSseStream"
  /assess/history:
    get:
      summary: 查询当前用户图片评估历史
      description: 分页查询当前登录用户的历史记录. page从1开始.
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - name: page
          in: query
          required: false
          description: 页码, 从1开始.
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: 每页条数.
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsePageAssessRecord"
  /user/info:
    get:
      summary: 获取当前用户信息
      description: 获取当前登录用户的基本信息.
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseUserInfo"
  /user/update-info:
    post:
      summary: 更新用户信息
      description: |
        支持修改用户名和密码.
        修改密码时必须提供旧密码进行验证.
        至少需要提供一个需要更新的字段.
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 新用户名 (可选, 长度3-50).
                  minLength: 3
                  maxLength: 50
                oldPassword:
                  type: string
                  description: 旧密码 (修改密码时必须提供, 长度至少6).
                  minLength: 6
                newPassword:
                  type: string
                  description: 新密码 (可选, 长度至少6).
                  minLength: 6
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseString"
components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: 访问令牌. 在Apifox中请使用全局变量{{token}}.
      schema:
        type: string
      example: "{{token}}"
  schemas:
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
      required:
        - accessToken
        - tokenType
        - expiresIn
    ResponseAuthTokenResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthTokenResponse"
      required:
        - code
        - message
    ResponsePredictResult:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PredictResult"
      required:
        - code
        - message
    ResponseBatchPredictResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/BatchPredictResponse"
      required:
        - code
        - message
    AssessBatchSseStream:
      type: string
      description: |
        SSE消息体. 事件通过event字段区分, data为JSON对象.
        start/progress: message, progress, total, completed.
        result: message, progress, total, completed, currentFileName, predictResult.
        completed: message, progress, total, completed, results.
        error: message.
      example: |
        event: start
        data: {"message":"批量评估任务开始","progress":0,"total":3}

        event: progress
        data: {"message":"模型批量评估中","progress":20,"total":3}

        event: result
        data: {"message":"已完成单张评估","currentFileName":"a.jpg","progress":33,"total":3,"completed":1,"predictResult":{"file_name":"a.jpg","quality_score":0.92,"scene":1,"distortion":2}}

        event: completed
        data: {"message":"批量评估完成","progress":100,"total":3,"completed":3,"results":[]}
    ResponsePageAssessRecord:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageAssessRecord"
      required:
        - code
        - message
    ResponseString:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: string
      required:
        - code
        - message
    ResponseUserInfo:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserInfo"
      required:
        - code
        - message
    PredictResult:
      type: object
      properties:
        file_name:
          type: string
        quality_score:
          type: number
          format: float
        scene:
          type: integer
          format: int32
          description: 场景分类编码.
        distortion:
          type: integer
          format: int32
          description: 失真分类编码.
    BatchPredictResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PredictResult"
    AssessRecord:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        filename:
          type: string
        base64:
          type: string
          description: 压缩后图片的Base64字符串.
        assessTime:
          type: string
          format: date-time
        qualityScore:
          type: number
          format: double
          description: 图像评估的质量分数.
        scene:
          type: string
          description: 场景分类编码.
        distortion:
          type: string
          description: 失真类型编码.
    PageAssessRecord:
      type: object
      description: MyBatis-Plus分页结果.
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AssessRecord"
        total:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        current:
          type: integer
          format: int64
        pages:
          type: integer
          format: int64
    UserInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: 用户ID.
        username:
          type: string
          description: 用户名.
        registerTime:
          type: string
          format: date-time
          description: 注册时间.

